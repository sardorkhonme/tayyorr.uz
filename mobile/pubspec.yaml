name: tayyorr_app
description: "tayyorr.uz — talabalar uchun platforma"
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # tarmoq
  dio: ^5.7.0

  # Google bilan kirish
  google_sign_in: ^6.2.2
  # tashqi havolalarni ochish (Click to'lov sahifasi)
  url_launcher: ^6.3.1
  # profil rasmini tanlash
  image_picker: ^1.1.2
  # chatda fayl biriktirish (rasm, hujjat, arxiv va h.k.)
  file_picker: ^8.1.6
  # referal havolasini ulashish
  share_plus: ^10.1.4

  # holat boshqaruvi (BLoC)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # mahalliy saqlash
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

  # chat media — hammasi ilovaning o'zida: video, audio, PDF ko'rish,
  # fayllarni keshga yuklash, boshqa turlarni ochish, galereyaga saqlash
  video_player: ^2.11.1
  just_audio: ^0.10.6
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  gal: ^2.3.3
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^9.0.1
  # push bildirishnomalar (ilova yopiq bo'lsa ham)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # ovozli xabar yozish
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/tin.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Android 8+: fon (indigo gradient) va oldingi qatlam (oq "T") alohida —
  # telefon qanday shakl (doira, kvadrat) bersa ham chiroyli chiqadi
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
